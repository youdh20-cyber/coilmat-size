<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코일매트 차종별 호환표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ZN 디자인: 검정 #0D0D0D · 주황 #FF5A1F · 연회색 #F1F1F1 · 회색 #8A8A8A / Noto Sans CJK KR */
:root{
  --dk:#0d0d0d; --or:#ff5a1f; --or-ink:#fff;
  --bg:#f1f1f1; --card:#ffffff; --ink:#0d0d0d; --muted:#6f6f6f; --line:#e2e2e2;
  --soft:#f1f1f1; --code-bg:#0d0d0d; --code-ink:#fff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d0d0d; --card:#181818; --ink:#ffffff; --muted:#8a8a8a; --line:#2a2a2a;
    --soft:#242424; --code-bg:#f1f1f1; --code-ink:#0d0d0d;
  }
}
:root[data-theme="dark"]{
  --bg:#0d0d0d; --card:#181818; --ink:#ffffff; --muted:#8a8a8a; --line:#2a2a2a;
  --soft:#242424; --code-bg:#f1f1f1; --code-ink:#0d0d0d;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans CJK KR','Noto Sans KR',system-ui,sans-serif;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 80px}

/* 상단: 검정 띠 */
.top{background:var(--dk);color:#fff}
.top .wrap{padding-top:32px;padding-bottom:30px}
.logo{height:18px;display:block;margin-bottom:28px}
.eyebrow{color:var(--or);font-weight:700;font-size:13px;letter-spacing:.22em;margin:0}
.top h1{margin:8px 0 8px;font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.top h1 em{font-style:normal;color:var(--or)}
.top .lead{margin:0;color:#fff;font-size:17px;font-weight:500;line-height:1.55;word-break:keep-all}
.top .notice{margin:14px 0 0;padding-top:12px;border-top:1px solid #2a2a2a;font-size:13px;color:#8a8a8a;word-break:keep-all}
.top .notice b{color:var(--or)}

.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 10px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:0 12px}
.search:focus-within{border-color:var(--or)}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:12px 0;outline:none}
.search input::-webkit-search-cancel-button{display:none}
.search button{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px}
.seg{display:flex;gap:4px;margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;width:max-content}
.seg button{border:0;background:none;color:var(--muted);font:inherit;font-size:13px;font-weight:500;padding:5px 14px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--dk);color:#fff;font-weight:700}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#f1f1f1;color:#0d0d0d}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:#f1f1f1;color:#0d0d0d} }
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 13px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip .n{color:var(--muted);margin-left:4px;font-size:12px;font-weight:400}
.chip[aria-pressed="true"]{background:var(--or);border-color:var(--or);color:var(--or-ink);font-weight:700}
.chip[aria-pressed="true"] .n{color:var(--or-ink);opacity:.85}
.chip.zero{opacity:.45}
.summary{color:var(--muted);font-size:13px;margin:6px 0 0}

.maker{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:12px;overflow:hidden}
.maker>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:16px 18px;font-weight:700;font-size:18px}
.maker>summary::-webkit-details-marker{display:none}
.maker>summary .cnt{color:var(--or);font-weight:700;font-size:14px;margin-left:8px}
.maker>summary .rg{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
.maker>summary .arr{transition:transform .2s;color:var(--muted);display:grid}
.maker[open]>summary .arr{transform:rotate(180deg)}
.cars{padding:0 16px 10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:640px){ .cars{grid-template-columns:1fr} }
.car{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.car .name{font-weight:700;word-break:keep-all}
.car .yr{display:block;color:var(--muted);font-size:13px;font-weight:400}
.code{flex:none;text-align:center;border-radius:8px;background:var(--code-bg);color:var(--code-ink);padding:4px 9px;min-width:76px}
.code small{display:block;font-size:10px;opacity:.65;line-height:1.3}
.code b{font-size:15px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
mark{background:color-mix(in srgb,var(--or) 28%,transparent);color:inherit;border-radius:2px}
.empty{text-align:center;color:var(--muted);padding:48px 0}
.guide{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.guide ul{margin:6px 0 0;padding-left:18px}
.guide li+li{margin-top:3px}
.guide b{color:var(--ink)}
@media (min-width:641px){ .top h1{font-size:40px} .top .wrap{padding-top:44px;padding-bottom:40px} }
</style>
</head>

const $ = s => document.querySelector(s);
let maker = "전체", region = "전체";

/* --- 한글 초성 검색 (예: ㄱㄹㅈ → 그랜져, 쌍자음은 예사소리로) --- */
const CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const SOFT = { "ㄲ":"ㄱ","ㄸ":"ㄷ","ㅃ":"ㅂ","ㅆ":"ㅅ","ㅉ":"ㅈ" };
const cho = s => [...s].map(c => { const k = c.charCodeAt(0) - 0xAC00; const r = k >= 0 && k < 11172 ? CHO[Math.floor(k / 588)] : c; return SOFT[r] || r; }).join("");
/* 헷갈리기 쉬운 표기를 같게 취급: ㅐ/ㅔ(트랙스·트렉스), ㅙ/ㅚ/ㅞ, 쌍자음(쏘나타·소나타, 싼타페·산타페), 져/저 */
const FOLD_CHO = {1:0,4:3,8:7,10:9,13:12}, FOLD_JUNG = {1:5,3:7,10:15,11:15};
const fold = s => [...s].map(ch => { const k = ch.charCodeAt(0) - 0xAC00; if (k < 0 || k >= 11172) return ch;
  let c = Math.floor(k / 588), j = Math.floor((k % 588) / 28); const t = k % 28;
  c = FOLD_CHO[c] ?? c; j = FOLD_JUNG[j] ?? j; if ((c === 12 || c === 14) && j === 6) j = 4;
  return String.fromCharCode(0xAC00 + (c * 21 + j) * 28 + t); }).join("");
const norm = s => fold(String(s || "").toLowerCase().replace(/[\s\-_().·/,'’~]/g, ""));
const isCho = s => /^[ㄱ-ㅎ]+$/.test(s);

const MK = new Map(DATA.makers.map(m => [m.n, m]));
const cars = DATA.cars.map(c => { const m = MK.get(c.m) || {}; const k = norm(c.m + (m.k || "") + c.n + c.c); return { ...c, r: m.r, k, kc: cho(norm(c.m + c.n)) }; });

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function hl(text, q){
  const t = esc(text);
  if (!q || isCho(norm(q))) return t;
  const chars = [...q.replace(/\s+/g, "")].map(c => c.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  try { return t.replace(new RegExp("(" + chars.join("\\s*") + ")", "gi"), "<mark>$1</mark>"); } catch(_){ return t; }
}
function carHTML(c, q){
  return `<div class="car"><div class="name">${hl(c.n, q)}${c.y ? `<span class="yr">${esc(c.y)}</span>` : ""}</div>
    <div class="code"><small>제품코드</small><b>${hl(c.c, q)}</b></div></div>`;
}
const ARR = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>`;

function render(){
  const raw = $("#q").value.trim(), q = norm(raw);
  $("#clear").hidden = !raw;
  const searched = cars.filter(c => !q || (isCho(q) ? c.kc.includes(cho(q)) : c.k.includes(q)));
  const inRegion = searched.filter(c => region === "전체" || c.r === region);

  $("#region").innerHTML = ["전체","국산","수입"].map(g =>
    `<button data-region="${g}" aria-pressed="${region === g}">${g} ${searched.filter(c => g === "전체" || c.r === g).length}</button>`).join("");

  const makers = DATA.makers.filter(m => region === "전체" || m.r === region);
  if (maker !== "전체" && !makers.some(m => m.n === maker)) maker = "전체";
  const cnt = m => inRegion.filter(c => c.m === m).length;
  $("#chips").innerHTML =
    `<button class="chip" data-maker="전체" aria-pressed="${maker === "전체"}">전체<span class="n">${inRegion.length}</span></button>` +
    makers.map(m => { const n = cnt(m.n); return `<button class="chip${q && !n ? " zero" : ""}" data-maker="${esc(m.n)}" aria-pressed="${maker === m.n}">${esc(m.n)}<span class="n">${n}</span></button>`; }).join("");

  const hits = inRegion.filter(c => maker === "전체" || c.m === maker);
  $("#summary").textContent = q ? `‘${raw}’ 검색 결과 ${hits.length}개`
    : maker === "전체" ? `제조사 ${makers.length}곳 · 차종 ${hits.length}개 · 제조사를 눌러 펼쳐 보세요` : `${maker} 차종 ${hits.length}개`;

  if (!hits.length){
    $("#list").innerHTML = `<div class="empty">찾는 차종이 없습니다.<br>${q && searched.length ? `다른 제조사·구분에 ${searched.length}개 결과가 있어요. «전체»를 눌러 보세요.` : "모델명 일부나 초성(예: ㄱㄹㅈ), 제품코드로 다시 검색해 보세요."}</div>`;
    return;
  }
  const openAll = !!q || maker !== "전체";
  $("#list").innerHTML = (maker === "전체" ? makers.map(m => m.n) : [maker]).map(m => {
    const list = hits.filter(c => c.m === m);
    if (!list.length) return "";
    return `<details class="maker"${openAll ? " open" : ""}>
      <summary><span>${esc(m)}<span class="cnt">${list.length}</span>${region === "전체" ? `<span class="rg">${esc(MK.get(m).r)}</span>` : ""}</span><span class="arr">${ARR}</span></summary>
      <div class="cars">${list.map(c => carHTML(c, raw)).join("")}</div></details>`;
  }).join("");
}

/* 이벤트 */
$("#q").addEventListener("input", render);
$("#clear").onclick = () => { $("#q").value = ""; render(); $("#q").focus(); };
$("#chips").onclick = e => { const b = e.target.closest("[data-maker]"); if (b){ maker = b.dataset.maker; render(); } };
$("#region").onclick = e => { const b = e.target.closest("[data-region]"); if (b){ region = b.dataset.region; maker = "전체"; render(); } };

const qs = new URLSearchParams(location.search);
if (qs.get("maker") && MK.has(qs.get("maker"))) { maker = qs.get("maker"); region = MK.get(maker).r; }
render();
</script>
</body>
</html>
